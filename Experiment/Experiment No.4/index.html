<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex Secure Bank</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

<h1>Apex Secure Bank</h1>
<p class="subtitle">Password Palindrome Checker</p>

<label>ENTER YOUR PASSWORD</label>

<div class="inputBox">

<input
type="password"
id="password"
placeholder="Enter Password">

<i class="fa-solid fa-eye-slash" id="toggle"></i>

</div>

<div class="line"></div>

<button id="verifyBtn">
Verify Password
</button>

<hr>

<p class="operation">SELECT BANKING OPERATION:</p>

<button class="changeBtn">
📧 Change Password
</button>

<button class="logoutBtn">
❌ Log Out
</button>

<div id="result" class="result"></div>

<footer>
Created by Chhatrapati Supre
</footer>

</div>

<script src="script.js"></script>

</body>
</html>
