<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Billing Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Billing Calculator</h1>

    <label>Customer Name</label>
    <input type="text" id="customer" placeholder="Enter Name">

    <label>Product Name</label>
    <input type="text" id="product" placeholder="Enter Product">

    <label>Quantity</label>
    <input type="number" id="qty" placeholder="Enter Quantity">

    <label>Price per Item (₹)</label>
    <input type="number" id="price" placeholder="Enter Price">

    <button onclick="generateBill()">Generate Bill</button>

    <div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
